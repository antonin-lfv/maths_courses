# Cartes de la page d'accueil.
cycles:
  - nom: Collège
    niveaux:
      - { section: 6eme, titre: "6e", accroche: "Nombres entiers et décimaux, fractions, premiers pas en géométrie." }
      - { section: 5eme, titre: "5e", accroche: "Nombres relatifs, fractions, calcul littéral, triangles et parallélogrammes." }
      - { section: 4eme, titre: "4e", accroche: "Puissances, calcul littéral, équations, Pythagore et Thalès." }
      - { section: 3eme, titre: "3e", accroche: "Arithmétique, fonctions affines, Thalès, trigonométrie : cap sur le brevet." }
  - nom: Lycée
    niveaux:
      - { section: seconde, titre: "Seconde", accroche: "Fonctions de référence, vecteurs, équations de droites, statistiques." }
      - { section: premiere, titre: "Première", accroche: "Second degré, dérivation, suites, exponentielle, produit scalaire." }
      - { section: terminale, titre: "Terminale", accroche: "Spécialité, maths expertes et maths complémentaires." }
  - nom: Licence
    niveaux:
      - { section: l1, titre: "L1", accroche: "Logique, complexes, polynômes, algèbre linéaire, suites, fonctions, intégration." }
      - { section: l2, titre: "L2", accroche: "Réduction, espaces euclidiens, séries, fonctions de plusieurs variables, probabilités." }
      - { section: l3, titre: "L3", accroche: "Topologie, calcul différentiel, intégrale de Lebesgue, groupes, anneaux, probabilités." }
