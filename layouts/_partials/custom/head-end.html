{{- /* Polices : Fraunces pour les titres, Inter pour le texte. */ -}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">

{{- /* Teinte du niveau (6e, 5e…), réutilisée par la feuille de style. */ -}}
{{- $teinte := index site.Data.niveaux.teintes (.FirstSection.Section | default "accueil") | default 222 -}}
<style>:root{--niveau-h:{{ $teinte }}}</style>
