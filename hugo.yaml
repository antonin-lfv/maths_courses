baseURL: "https://antoninlefevre.github.io/maths_courses/"
languageCode: fr
defaultContentLanguage: fr
title: Mathématiques
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ["$$", "$$"]]
          inline: [['\(', '\)']]
        enable: true
    renderer:
      unsafe: true

params:
  # Feuille de style KaTeX : version fixée sur celle qu'utilise Hugo pour
  # générer les formules (KaTeX 0.16). Avec « latest » (0.19), les noms de
  # classes ne correspondent plus et les formules s'affichent mal.
  math:
    katex:
      base: "https://cdn.jsdelivr.net/npm/katex@0.16.22/dist"

  navbar:
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      width: 26
      height: 26

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: false

menu:
  main:
    - identifier: college
      name: Collège
      weight: 1
    - name: 6e
      parent: college
      pageRef: /6eme
      weight: 1
    - name: 5e
      parent: college
      pageRef: /5eme
      weight: 2
    - name: 4e
      parent: college
      pageRef: /4eme
      weight: 3
    - name: 3e
      parent: college
      pageRef: /3eme
      weight: 4
    - identifier: lycee
      name: Lycée
      weight: 2
    - name: Seconde
      parent: lycee
      pageRef: /seconde
      weight: 1
    - name: Première
      parent: lycee
      pageRef: /premiere
      weight: 2
    - name: Terminale
      parent: lycee
      pageRef: /terminale
      weight: 3
    - identifier: licence
      name: Licence
      weight: 3
    - name: L1
      parent: licence
      pageRef: /l1
